<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itamar Farchy Portfolio</title>
<meta name="description" content="Backend and platform engineering portfolio: seven shipped systems as live diagrams, with an agent you can question about them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: an app, not a scroll. Home is a board of seven color blocks, one per project.
   Tap a block and it becomes that project's screen: a live scene and a flow, in its color. */
:root{
  --paper:#fffdf8; --sheet:#ffffff; --ink:#15131f; --ink-2:#5b5670; --line:#ddd8ea;
  --ok:#00916a; --bad:#e0352b;
  --accent:#3d4fb8; --accent-ink:#ffffff;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --paper:#15131f; --sheet:#1f1c2d; --ink:#f6f3ff; --ink-2:#aaa4c2; --line:#3a3552; --ok:#3ddba9; --bad:#ff6b5e; color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#15131f; --sheet:#1f1c2d; --ink:#f6f3ff; --ink-2:#aaa4c2; --line:#3a3552; --ok:#3ddba9; --bad:#ff6b5e; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;flex:none}
.top .name{white-space:nowrap;font-family:var(--display);font-weight:900;font-size:clamp(19px,5vw,24px);text-transform:uppercase;letter-spacing:.02em;background:none;border:0;padding:0}
.top nav{display:flex;gap:8px}
.top nav a{color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;border:2px solid var(--ink);border-radius:999px;padding:5px 12px}
.top nav a:hover{background:var(--ink);color:var(--paper)}
main{flex:1;min-height:0;padding:0 20px 20px;display:flex;flex-direction:column}
[hidden]{display:none !important}

/* Home board */
@keyframes march{to{background-position:24px 0}}
@keyframes marchY{to{background-position:0 18px}}
@keyframes pop{from{transform:scale(.94)}to{transform:none}}
.board{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:12px;min-height:520px}
.tile{position:relative;overflow:hidden;border:0;border-radius:18px;padding:18px;text-align:left;background:var(--c);color:var(--ci);display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:150px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) backwards;transition:transform .18s,box-shadow .18s}
button.tile:hover{transform:translateY(-5px) rotate(-1deg);box-shadow:0 14px 0 -6px var(--ink)}
.tile .num{font-family:var(--display);font-weight:900;font-size:64px;line-height:.8;opacity:.28}
.tile h3{font-size:clamp(22px,2.3vw,32px);font-weight:900}
.tile .stat{font-size:14px;font-weight:500;line-height:1.3}
.tile .stat b{font-family:var(--display);font-size:24px;font-weight:900;text-transform:uppercase;display:block;line-height:1}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,currentColor 0 12px,transparent 12px 24px);opacity:.45;animation:march .8s linear infinite}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ic{width:84px;height:84px;flex:none;overflow:visible}
.ic *{transform-box:fill-box;transform-origin:center}
.ic .s{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}
.ic .dim{opacity:.45}
@keyframes nblink{0%,100%{opacity:.35;transform:scale(.8)}30%{opacity:1;transform:scale(1.15)}}
.ic .n{animation:nblink 1.8s infinite}.ic .n2{animation-delay:.3s}.ic .n3{animation-delay:.6s}
@keyframes eyeblink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes eyelook{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.ic .eye{animation:eyeblink 3.4s infinite}.ic .iris{animation:eyelook 3.4s ease-in-out infinite}
@keyframes k1{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes k2{0%,100%{transform:translateX(0)}50%{transform:translateX(-22px)}}
.ic .kn1{animation:k1 2.6s ease-in-out infinite}.ic .kn2{animation:k2 3.1s ease-in-out infinite}.ic .kn3{animation:k1 3.6s ease-in-out infinite}
@keyframes fanL{0%,15%,100%{transform:rotate(0)}45%,80%{transform:rotate(-20deg) translateX(-7px)}}
@keyframes fanR{0%,15%,100%{transform:rotate(0)}45%,80%{transform:rotate(20deg) translateX(7px)}}
.ic .cl{transform-origin:50% 100%;animation:fanL 3.2s ease-in-out infinite}.ic .cr{transform-origin:50% 100%;animation:fanR 3.2s ease-in-out infinite}
@keyframes d1{0%{stroke-dashoffset:1}20%,100%{stroke-dashoffset:0}}
@keyframes d2{0%,20%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}
@keyframes d3{0%,40%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes d4{0%,60%{stroke-dashoffset:1}78%,100%{stroke-dashoffset:0}}
.ic .dr{stroke-dasharray:1;animation-duration:3.4s;animation-iteration-count:infinite;animation-timing-function:ease-out}
.ic .dr1{animation-name:d1}.ic .dr2{animation-name:d2}.ic .dr3{animation-name:d3}.ic .dr4{animation-name:d4}
@keyframes zap{0%,55%,100%{opacity:.35;transform:scale(.9)}62%{opacity:1;transform:scale(1.25)}70%{opacity:.5}78%{opacity:1;transform:scale(1.1)}}
.ic .bolt{animation:zap 2.4s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
.ic .g1{animation:spin 8s linear infinite}.ic .g2{animation:spinr 6s linear infinite}
.phead{position:relative}
.phead .ic{position:absolute;right:18px;bottom:14px;width:92px;height:92px}
.phead h2,.phead p{padding-right:110px}
.tile.intro{--c:var(--ink);--ci:var(--paper);justify-content:flex-end}
.tile.intro h1{font-size:clamp(28px,3vw,44px);font-weight:900}
.tile.intro p{margin:0;font-size:14.5px;opacity:.8}
.tile.intro::after{display:none}
@media (max-width:900px){
  .board{grid-template-columns:repeat(2,1fr);grid-auto-rows:auto;min-height:0;flex:none}
  .tile.intro,.tile:last-child{grid-column:span 2}
  .tile{min-height:132px;padding:14px;border-radius:14px}
  .tile .num{font-size:44px}
  .ic{width:58px;height:58px}
  .phead .ic{display:none}
  .phead h2,.phead p{padding-right:0}
  .tile.intro{min-height:0}
}

/* Project screen */
.proj{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--sheet);border:3px solid var(--accent);animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
.phead{background:var(--accent);color:var(--accent-ink);padding:14px 18px 16px;display:grid;gap:10px}
.pnav{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pnav button{background:transparent;border:2px solid currentColor;border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px;color:inherit}
.pnav button:hover{background:var(--accent-ink);color:var(--accent)}
.phead h2{font-size:clamp(30px,5vw,56px);font-weight:900}
.phead p{margin:0;max-width:60ch;font-size:16px;opacity:.92}
.pbody{flex:1;min-height:0;overflow:auto;padding:16px 18px 90px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-content:start}
.side{display:grid;gap:12px;align-content:start}
.imp{border-radius:12px;background:var(--paper);border:2px solid var(--line);padding:10px 12px}
.imp b{display:block;font-family:var(--display);font-weight:900;font-size:34px;line-height:1;text-transform:uppercase;color:var(--ink)}
.imp span{font-size:13.5px;color:var(--ink-2)}
.tech{display:flex;flex-wrap:wrap;gap:6px}
.tech span{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink-2)}
.stage{display:grid;gap:12px;align-content:start;min-width:0}
.flowbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
#p-tabs[hidden]{display:none}
.tabs{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.tabs button{border:0;background:transparent;padding:6px 16px;font-size:14px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:9px 18px;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
@media (max-width:900px){
  .pbody{grid-template-columns:minmax(0,1fr);padding:14px 14px 90px}
  .side{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .side .tech{grid-column:1/-1}
  .imp b{font-size:26px}
  .stage{order:-1}
}

/* Architecture diagram */
.archwrap{border-radius:14px;border:2px solid var(--line);background:var(--paper);padding:12px;display:grid;gap:10px;min-width:0}
.archwrap .flowbar .mono{color:var(--ink-2)}
.archscroll{overflow-x:auto}
.arch{width:100%;height:auto;display:block;margin:0 auto}
.anode{cursor:pointer;outline:none}
.anode rect{fill:var(--sheet);stroke:var(--line);stroke-width:2;transition:fill .2s,stroke .2s}
.anode.k-ext rect{stroke-dasharray:6 4}
.anode:hover rect,.anode:focus-visible rect,.anode.hot rect{stroke:var(--accent)}
.anode.sel rect{fill:var(--accent);stroke:var(--accent)}
.nt{font:600 13px var(--body);fill:var(--ink)}
.ns{font:10.5px var(--mono);fill:var(--ink-2)}
.anode.sel .nt,.anode.sel .ns{fill:var(--accent-ink)}
.ki *{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ki .lam{fill:var(--accent);stroke:none;font:700 21px var(--body)}
.anode.sel .ki *{stroke:var(--accent-ink)}
.anode.sel .ki .lam{fill:var(--accent-ink);stroke:none}
.edge{fill:none;stroke:var(--accent);stroke-width:2;opacity:.5;transition:opacity .2s,stroke-width .2s}
.edge.dash{stroke-dasharray:5 5}
.arch.dimmed .edge{opacity:.16}
.arch.dimmed .pk{opacity:.25}
.arch .edge.hot{opacity:1;stroke-width:3.5}
.ahm,.pk{fill:var(--accent)}
.elab{font:10.5px var(--mono);fill:var(--ink-2);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.callout{border-radius:12px;padding:8px 12px;background:var(--sheet);border-left:5px solid var(--accent);font-size:14.5px;min-height:58px}
.callout p{margin:2px 0 0}
.callout .mono{color:var(--ink-2)}

/* Scenes */
.scene{position:relative;border-radius:14px;background:var(--paper);border:2px solid var(--line);padding:14px;min-height:200px;overflow:hidden;display:flex;flex-direction:column;gap:12px;justify-content:center}
.scene .cap{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.scene .big b{font-family:var(--display);font-weight:900;font-size:52px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.scene .big span{color:var(--ink-2);font-size:13.5px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
@keyframes run{from{left:-14px}to{left:100%}}
.lane{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;margin:5px 0}
.lane .lbl{font-size:13.5px;font-weight:600}
.track{position:relative;height:20px;border-radius:10px;background:var(--line);overflow:hidden}
.track i{position:absolute;top:4px;left:-14px;width:12px;height:12px;border-radius:50%;background:var(--accent);animation:run linear infinite}
.phgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:460px}
.ph{position:relative;aspect-ratio:4/3;border-radius:8px;filter:grayscale(1) contrast(.7) brightness(1.1);transition:filter .5s,opacity .3s,transform .3s}
.ph.done{filter:none;transform:scale(1.03)}
.ph.done::after{content:"✓";position:absolute;right:5px;bottom:2px;color:#fff;font-size:13px;font-weight:700;text-shadow:0 0 3px rgba(0,0,0,.6)}
.ph.hide{opacity:0}
.bar{height:10px;border-radius:5px;background:var(--line);max-width:460px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
.p3{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.p3 .users{display:grid;gap:8px}
.ucard,.model{border:2px solid var(--line);border-radius:10px;background:var(--sheet);padding:8px 10px;transition:border-color .2s,transform .2s}
.ucard.on{border-color:var(--accent);transform:translateX(6px)}
.model{border-color:var(--ink)}
.sl{height:7px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.sl i{display:block;height:100%;background:var(--accent);transition:width .6s}
.p3 .arrow{width:34px;height:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 12px);background-size:24px 3px;animation:march .7s linear infinite}
.xfer{display:grid;grid-template-columns:minmax(86px,1fr) 2fr minmax(86px,1fr);align-items:center}
.xfer .box{border:2px solid var(--ink);border-radius:12px;background:var(--sheet);padding:14px 8px;text-align:center;font-weight:600;font-size:14px}
.xfer .box.dash{border-style:dashed}
.xtrack{position:relative;height:44px;border-bottom:3px dashed var(--line)}
@keyframes fly{from{left:0}to{left:calc(100% - 42px)}}
@keyframes back{from{right:0;opacity:1}to{right:calc(100% - 16px);opacity:.2}}
.pkt{position:absolute;top:8px;left:0;width:42px;text-align:center;font-family:var(--mono);font-size:11px;border-radius:6px;background:var(--accent);color:var(--accent-ink);padding:4px 0;animation:fly 2.4s linear infinite}
.cb{position:absolute;bottom:-9px;right:0;width:14px;height:14px;border-radius:50%;background:var(--ok);animation:back 2.4s linear infinite}
.ledger{font-family:var(--mono);font-size:13px;display:grid;gap:3px;min-height:150px;align-content:start}
.ledger div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:2px 0;animation:drop .3s}
.ledger .div{justify-content:center;border:0;color:var(--bad)}
.ledger .sum{border:0;border-top:2px solid var(--ink);font-weight:500;padding-top:5px}
@keyframes drop{from{opacity:0;transform:translateY(-5px)}}
.devs{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.dev{border:2px solid var(--line);border-radius:10px;background:var(--sheet);padding:8px;transition:border-color .2s}
.dev.ready{border-color:var(--ok)}
.dev .svc{display:flex;gap:4px;margin:6px 0}
.dev .svc i{flex:1;height:14px;border-radius:3px;background:var(--line);transition:background .25s}
.dev .svc i.up{background:var(--accent)}
.dev small{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.shared{border:2px solid var(--ink);border-radius:12px;background:var(--sheet);padding:10px;font-weight:600;text-align:center}
.queue{display:flex;gap:8px;flex-wrap:wrap}
.queue span{border:2px dashed var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--ink-2)}
.queue span.on{border:2px solid var(--accent);color:var(--ink);font-weight:600}
@media (max-width:560px){.lane{grid-template-columns:82px 1fr}.p3{grid-template-columns:1fr}.p3 .arrow{display:none}.scene .big b{font-size:40px}}

/* Agent: one button, bottom right */
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,79,184,.5)}100%{box-shadow:0 0 0 16px rgba(61,79,184,0)}}
#fab{position:fixed;right:18px;bottom:18px;z-index:20;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:14px 20px;font-weight:600;animation:pulse 2s infinite}
#agent{position:fixed;right:18px;bottom:18px;z-index:30;width:min(400px,calc(100vw - 24px));height:min(600px,calc(100% - 36px));background:var(--sheet);border:3px solid var(--ink);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(21,19,31,.28)}
.a-head{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;background:var(--ink);color:var(--paper)}
.a-head b{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;line-height:1}
.a-head .mode{display:block;margin-top:3px;opacity:.7}
.a-head button{border:2px solid currentColor;border-radius:50%;background:transparent;color:inherit;width:32px;height:32px;font-size:17px;line-height:1}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:#3d4fb8;color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg ul{margin:6px 0 0;padding-left:18px}
.act{align-self:flex-start;font-family:var(--mono);font-size:12px;color:var(--ok);border:1px dashed var(--ok);border-radius:8px;padding:4px 8px}
.a-sugg{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}
.chip{flex:none;border:2px solid var(--line);background:transparent;padding:5px 11px;font-size:13px;border-radius:999px}
.chip:hover{border-color:var(--ink)}
#chatform{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
#chatform input{flex:1;min-width:0;padding:10px 14px;border:2px solid var(--line);border-radius:999px;background:var(--paper)}
#chatform .btn{background:#3d4fb8;color:#fff}
@media (max-width:560px){#agent{right:0;bottom:0;width:100%;height:80%;border-width:3px 0 0;border-radius:18px 18px 0 0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .ph.done,.ucard.on{transform:none}
  .pk{display:none}
}
</style>
</head>
<body>

<header class="top">
  <button type="button" class="name" id="home-btn"></button>
  <nav id="contact"></nav>
</header>

<main>
  <div class="board" id="home"></div>
  <section class="proj" id="proj" hidden>
    <div class="phead">
      <div class="pnav">
        <button type="button" id="back">← All projects</button>
        <span><button type="button" id="prev" aria-label="Previous project">‹</button> <button type="button" id="next" aria-label="Next project">›</button></span>
      </div>
      <h2 id="p-title"></h2>
      <p id="p-lede"></p>
      <span id="p-ic"></span>
    </div>
    <div class="pbody">
      <div class="side" id="p-side"></div>
      <div class="stage">
        <div id="p-tabs"></div>
        <div class="scene" id="scene"></div>
        <div class="archwrap">
          <div class="flowbar"><span class="mono">Architecture</span><button class="btn" type="button" id="run">▶ Run the flow</button></div>
          <div class="archscroll" id="arch"></div>
          <div class="callout" id="callout"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<button id="fab" type="button">Ask the agent</button>

<aside id="agent" hidden aria-label="Portfolio agent">
  <div class="a-head">
    <div><b>Portfolio agent</b><span class="mono mode" id="mode">Connecting</span></div>
    <button type="button" id="a-close" aria-label="Close chat">×</button>
  </div>
  <div id="log" aria-live="polite"></div>
  <div class="a-sugg" id="a-sugg"></div>
  <form id="chatform">
    <input id="chat-q" type="text" autocomplete="off" placeholder="Ask about a project" aria-label="Your question">
    <button class="btn" type="submit">Send</button>
  </form>
</aside>

<script src="kb.js"></script>
<script>
(function(){
  var P = window.PORTFOLIO;
  var CHAT_ENDPOINT = "/api/chat";
  var $ = function(id){ return document.getElementById(id); };
  var el = function(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };
  var pad = function(n){ return (n<10?"0":"")+n; };
  var byId = function(id){ return P.projects.filter(function(p){ return p.id===Number(id); })[0]; };

    var a=ARCH[state.current], mob=mobQ.matches;
    var CW=mob?170:198, CH=mob?94:108, NW=150, NH=58, PAD=6, pos={}, maxC=0, maxR=0;
    a.n.forEach(function(n){ maxC=Math.max(maxC,n[4]); maxR=Math.max(maxR,n[5]); });
    var cols=(mob?maxR:maxC)+1, rows=(mob?maxC:maxR)+1, W=cols*CW+PAD*2, H=rows*CH+PAD*2;
    a.n.forEach(function(n){ var gc=mob?n[5]:n[4], gr=mob?n[4]:n[5]; pos[n[0]]={x:PAD+gc*CW+CW/2, y:PAD+gr*CH+CH/2, gc:gc, gr:gr}; });
    var out='<svg class="arch" viewBox="0 0 '+W+' '+H+'" style="max-width:'+W+'px" role="img" aria-label="Architecture diagram">'+
      '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="ahm" d="M0 0L10 5L0 10z"/></marker></defs>';
    var labels="";
    a.e.forEach(function(e,i){
      var s=pos[e[0]], t=pos[e[1]], o=e[2]||{}, gx=t.gc-s.gc, gy=t.gr-s.gr, x1,y1,x2,y2,d, G=3;
      if(Math.abs(gx)>=Math.abs(gy) && gx!==0){
        var sg=gx>0?1:-1; x1=s.x+sg*NW/2; y1=s.y; x2=t.x-sg*(NW/2+G); y2=t.y; var mx=(x1+x2)/2;
        d="M"+x1+" "+y1+"C"+mx+" "+y1+" "+mx+" "+y2+" "+x2+" "+y2;
      } else {
        var sg2=gy>0?1:-1; x1=s.x; y1=s.y+sg2*NH/2; x2=t.x; y2=t.y-sg2*(NH/2+G); var my=(y1+y2)/2;
        d="M"+x1+" "+y1+"C"+x1+" "+my+" "+x2+" "+my+" "+x2+" "+y2;
      }
      out+='<path class="edge'+(o.dash?" dash":"")+'" data-i="'+i+'" d="'+d+'" marker-end="url(#ah)"'+(o.both?' marker-start="url(#ah)"':'')+'/>';
      out+='<circle class="pk" r="'+(o.dash?3:4)+'"><animateMotion dur="'+(o.dash?2.6:1.8)+'s" begin="-'+(i*0.27).toFixed(2)+'s" repeatCount="indefinite" path="'+d+'"/></circle>';
      if(o.l) labels+='<text class="elab" text-anchor="middle" x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-7)+'">'+o.l+'</text>';
    });
    out+=labels;
    a.n.forEach(function(n){
      var p=pos[n[0]];
      out+='<g class="anode k-'+n[1]+'" data-id="'+n[0]+'" tabindex="0" role="button" transform="translate('+(p.x-NW/2)+','+(p.y-NH/2)+')">'+
        '<rect width="'+NW+'" height="'+NH+'" rx="12"/><g class="ki" transform="translate(11,18)">'+KIND[n[1]]+'</g>'+
        '<text class="nt" x="42" y="25">'+n[2]+'</text><text class="ns" x="42" y="42">'+n[3]+'</text></g>';
    });
    $("arch").innerHTML=out+"</svg>";
    document.querySelectorAll("#arch .anode").forEach(function(g){
      var pickNode=function(){ stopRun(); selectNode(g.dataset.id); };
      g.onclick=pickNode; g.onkeydown=function(ev){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); pickNode(); } };
    });
    hint();
  }
  function hint(){
    clearMarks(); var co=$("callout"); co.textContent="";
    co.appendChild(el("span","mono","Architecture")); co.appendChild(el("p",null,"Tap any component to see what it does, or run the flow."));
  }
  function clearMarks(){
    document.querySelectorAll("#arch .sel,#arch .hot").forEach(function(x){ x.classList.remove("sel","hot"); });
    var sv=document.querySelector("#arch svg"); if(sv) sv.classList.remove("dimmed");
  }
  function say(label,node){
    var co=$("callout"); co.textContent="";
    co.appendChild(el("span","mono",label)); co.appendChild(el("p",null,node[6]));
  }
  function selectNode(id){
    var a=ARCH[state.current], node=a.n.filter(function(n){ return n[0]===id; })[0]; if(!node) return;
    clearMarks(); document.querySelector("#arch svg").classList.add("dimmed");
    document.querySelector('#arch .anode[data-id="'+id+'"]').classList.add("sel");
    a.e.forEach(function(e,i){ if(e[0]===id||e[1]===id) document.querySelector('#arch .edge[data-i="'+i+'"]').classList.add("hot"); });
    say(node[2]+" · "+node[3], node);
  }
  function stepEdge(i){
    var a=ARCH[state.current], e=a.e[i], node=a.n.filter(function(n){ return n[0]===e[1]; })[0];
    clearMarks(); document.querySelector("#arch svg").classList.add("dimmed");
    document.querySelector('#arch .edge[data-i="'+i+'"]').classList.add("hot");
    document.querySelector('#arch .anode[data-id="'+e[0]+'"]').classList.add("hot");
    document.querySelector('#arch .anode[data-id="'+e[1]+'"]').classList.add("sel");
    say("Step "+pad(i+1)+" of "+pad(a.e.length)+" · "+node[2], node);
  }
  function runFlow(){
    if(!state.current) return;
    var n=ARCH[state.current].e.length; state.node=0; stepEdge(0); $("run").textContent="■ Stop";
    state.timer=setInterval(function(){ if(state.node>=n-1){ stopRun(); return; } state.node++; stepEdge(state.node); }, 1700);
  }
  function markTabs(){ document.querySelectorAll(".tabs button").forEach(function(t){ t.setAttribute("aria-selected", String(Number(t.dataset.i)===state.flowIdx)); }); }
  mobQ.addEventListener("change",function(){ if(state.current){ stopRun(); drawArch(); } });
  function stopRun(){ if(state.timer){ clearInterval(state.timer); state.timer=null; } $("run").textContent="▶ Run the flow"; }
  $("run").onclick=function(){ state.timer ? stopRun() : runFlow(); };

  /* ---------- agent ---------- */
  var history=[], busy=false, greeted=false;
  var GENERAL=[
    ["Biggest business impact?","Which project had the biggest business impact?"],
    ["How does he work?","What patterns show up in how Itamar works, across the projects?"],
    ["Unfamiliar code?","How does he handle unfamiliar code and stacks?"],
    ["Show me the ledger","Show me how the payout ledger works"]
  ];
  var PER_PROJECT=[
    ["Why was it needed?","What problem did this project solve, and why did it matter?"],
    ["What was built?","What exactly did Itamar build here, in plain terms?"],
    ["His role","What was Itamar's role and ownership on this project?"],
    ["Key trade-off","What was the key design decision or trade-off here, and why?"]
  ];
  function refreshSuggestions(){
    var box=$("a-sugg"); box.textContent="";
    var p=state.current?byId(state.current):null;
    (p?PER_PROJECT:GENERAL).forEach(function(s){
      var c=el("button","chip",s[0]); c.type="button";
      c.onclick=function(){ send(p ? 'About "'+p.title+'": '+s[1] : s[1]); };
      box.appendChild(c);
    });
  }
  var samplePromise = (window.claude && typeof window.claude.use==="function")
    ? window.claude.use("sample").catch(function(){ return null; }) : Promise.resolve(null);
  var endpointDown = !/^https?:$/.test(location.protocol);
  samplePromise.then(function(s){ if(s) setMode("Live model"); else if(endpointDown) setMode("Offline lookup"); else setMode("Ready"); });
  function setMode(t){ $("mode").textContent=t; }

  function esc(s){ return s.replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function fmt(text){
    var lines=esc(text).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n/), out="", inList=false;
    lines.forEach(function(l){
      var m=l.match(/^\s*[-•]\s+(.*)$/);
      if(m){ if(!inList){ out+="<ul>"; inList=true; } out+="<li>"+m[1]+"</li>"; }
      else { if(inList){ out+="</ul>"; inList=false; } if(l.trim()) out+=(out&&!/<\/ul>$/.test(out)?"<br>":"")+l; }
    });
    return out+(inList?"</ul>":"");
  }
  var TAG=/\[\[(open|run|tech):([^\]]+)\]\]/g;
  function visible(text){ return text.replace(TAG,"").replace(/\[\[[^\]]*\]?\]?\s*$/,"").trim(); }
  function addMsg(role, text){ var m=el("div","msg "+role); m.dir="auto"; m.innerHTML=fmt(text); $("log").appendChild(m); $("log").scrollTop=$("log").scrollHeight; return m; }
  function addAct(text){ $("log").appendChild(el("div","act",text)); $("log").scrollTop=$("log").scrollHeight; }
  function doActions(text){
    var m; TAG.lastIndex=0;
    while((m=TAG.exec(text))){
      if(m[1]==="tech") continue;
      var p=byId(parseInt(m[2],10)); if(!p) continue;
      if(p.id!==state.current){ location.hash="#p"+p.id; render(); }
      if(m[1]==="run"){ runFlow(); addAct("→ Opened "+p.title+" and started its flow"); }
      else addAct("→ Opened "+p.title);
    }
  }

  /* Fallback when no model is reachable: plain keyword lookup in the same notes. */
  function localAnswer(q){
    var ids=P.pick(q,1), best=ids.length?byId(ids[0]):null;
    var pre="The live model isn't connected here, so this is a plain lookup in the project notes.\n\n";
    if(!best) return pre+"I couldn't match that to a project. Try naming a technology or a project, for example Kubernetes, the ledger or the sandbox.";
    return pre+"**"+best.title+"**\n**Problem:** "+best.problem+"\n**Built:** "+best.built+(best.decision?"\n**Key decision:** "+best.decision:"")+"\n[[open:"+best.id+"]]";
  }

  async function askModel(onText){
    var sample=await samplePromise;
    if(sample){
      try{
        var msgs=history.map(function(m){ return {role:m.role, content:m.content}; });
        msgs[0]={role:"user", content:P.systemPrompt()+"\n\n----\nThe conversation with the visitor starts here.\n\n"+msgs[0].content};
        var r=await sample(msgs,{ onText:function(e){ onText(e.text); }, cache:false, modelTier:"quick" });
        setMode("Live model"); return r.text;
      }catch(e){ setMode("Offline lookup"); }
    } else if(!endpointDown){
      try{
        var res=await fetch(CHAT_ENDPOINT,{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages:history.slice(-12)}) });
        if(res.status===429){ return "The agent is busy right now. Give it a minute and ask again."; }
        if(!res.ok) throw new Error("endpoint "+res.status);
        var data=await res.json(); setMode("Live model"); return String(data.text||"");
      }catch(e){ endpointDown=true; setMode("Offline lookup"); }
    }
    return localAnswer(history[history.length-1].content);
  }

  async function send(q){
    q=(q||"").trim(); if(!q||busy) return;
    busy=true; openAgent();
    addMsg("u",q); history.push({role:"user",content:q.slice(0,1500)});
    var bubble=addMsg("a","…");
    var text=await askModel(function(t){ var v=visible(t); if(v){ bubble.innerHTML=fmt(v); $("log").scrollTop=$("log").scrollHeight; } });
    bubble.innerHTML=fmt(visible(text)||"I couldn't produce an answer. Please try again.");
    history.push({role:"assistant",content:text||"(no answer)"});
    doActions(text||""); busy=false; $("log").scrollTop=$("log").scrollHeight;
  }
  function openAgent(){
    $("agent").hidden=false; $("fab").hidden=true;
    if(!greeted){ greeted=true; addMsg("a","Hi. The diagrams show what was built; I have the story behind them, from Itamar's own notes. Ask me anything, or tap a question below."); }
  }
  function closeAgent(){ $("agent").hidden=true; $("fab").hidden=false; }
  $("fab").onclick=function(){ openAgent(); $("chat-q").focus(); };
  $("a-close").onclick=closeAgent;
  $("chatform").addEventListener("submit",function(e){ e.preventDefault(); var i=$("chat-q"); send(i.value); i.value=""; });
  document.addEventListener("keydown",function(e){ if(e.key!=="Escape") return; if(!$("agent").hidden) closeAgent(); else if(state.current) go(null); });

  render();
})();
</script>
</body>
</html>
